services:
  - type: web
    name: era-ai
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: DATABASE_URL
        fromDatabase:
          name: era-ai-db
          property: connectionString
      - key: ERA_DB_SSL
        value: "true"
      - key: ERA_ALLOWED_ORIGIN
        sync: false
      - key: UPSTOX_ACCESS_TOKEN
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: openai/gpt-4o-mini
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        value: mailto:admin@era-ai.app
      - key: ERA_AUTH_SESSION_SECRET
        generateValue: true
      - key: ERA_BROKER_EXECUTION_ENABLED
        value: "false"

databases:
  - name: era-ai-db
    plan: free
